# Scenario-local settings generated by `snakemake generate_template`.
# Edit active values for this scenario; repeat generation with
# template.merge: true preserves those edits.
# Template-only controls are kept in generate_template.yaml.

scenario:
  currency: INR
  fiscal_year: true
  base_year: 2030
  years:
    - 2030
    - 2035
    - 2040
    - 2045
    - 2050
mode: myopic
family: expansion
spatial:
  boundary:
    level: region
    id: NR
  resolution: state
  external: none
  role_buses: shared
snapshots:
  select: all
  resolution: 3
components:
  new_generators: true
  new_stores: true
  links: true
  transfer: false
carriers:
  - Coal
  - Lignite
  - Nuclear
  - Hydro
  - Hydro RoR
  - Hydro Storage
  - Solar
  - Wind
  - LFO
  - Co-Gen
  - Market
  - PSP
  - Battery Storage
costs:
  wacc_row: default
  wacc_row_storage: storage
  discount_rate: 0.0
  include_fom: true
unit_commitment:
  enable: false
constraints:
  - class: CO2EmissionLimit
    name: india_co2_cap
    limit_tco2:
      2025: 1500000000
      2030: 1400000000
      2035: 1200000000
      2040: 1000000000
      2045: 800000000
      2050: 600000000
    basis: electrical_output

# ─── Available constraints (catalogue) ───
#
# Every constraint pypsa-india ships. Uncomment an entry, give it a
# unique `name`, and it is applied. Numeric fields may be written as a
# year-keyed map covering every modelled year and are resolved per horizon;
# a bare number means the same value in every year.
#
# `scope` narrows a constraint that supports it and is optional there:
# {bus: NR}, {state_id: KL} or {region_id: SR}. Omitted, the constraint
# covers the whole model. ImportExportLimit uses its endpoints instead.
#
# CO2EmissionLimit
#   Cap CO2 from generation. `basis` picks electrical_output or fuel_input.
#
#   - class: CO2EmissionLimit
#     name: my_co2emissionlimit
#     limit_tco2: 12000000   # tCO2 per year
#     basis: electrical_output   # electrical_output | fuel_input
#     scope: {bus: NR}   # optional — omit for the whole model; also state_id / region_id
#
# FuelSupplyLimit
#   Cap annual energy from one carrier — an absolute energy or fuel-supply ceiling.
#   Reach for this when a carrier's annual energy is limited by something
#   outside the model — coal rakes, a domestic uranium allocation, a gas
#   contract, a river's water. Unlike MonthlyCufsProfile the right-hand side
#   is a constant in MWh, so building more plant does NOT relax it.
#   One entry per constrained carrier, each with its own `name`:
#
#     - class: FuelSupplyLimit
#       name: coal_supply
#       carrier: Coal
#       limit_mwh: 90000000
#       basis: electrical_output
#
#     - class: FuelSupplyLimit
#       name: nuclear_fuel
#       carrier: Nuclear
#       limit_mwh: 52000000
#       basis: electrical_output
#
#   `basis: fuel_input` divides by Generator.efficiency, so limit_mwh is then
#   thermal MWh of fuel rather than MWh sent out. Pick one and stay on it.
#
#   - class: FuelSupplyLimit
#     name: my_fuelsupplylimit
#     carrier: Coal   # Coal | Lignite | Nuclear | Gas | Hydro | ...
#     limit_mwh: 90000000   # MWh per year
#     basis: electrical_output   # electrical_output | fuel_input
#     scope: {bus: NR}   # optional — omit for the whole model; also state_id / region_id
#
# ImportExportLimit
#   Cap net flow on the corridor between two buses.
#
#   - class: ImportExportLimit
#     name: my_importexportlimit
#     from_bus: NR   # existing electricity bus
#     to_bus: WR   # existing electricity bus
#     max_export_mw: 5000   # MW
#     max_import_mw: 5000   # MW
#
# MonthlyCufsProfile
#   Per-month CUF ceiling/floor for one carrier — the Monthly_Constraints sheet.
#   A genuine capacity factor: the bound scales with whatever is built, so
#   new build relaxes it proportionally. For a ceiling that new build cannot
#   inflate — a season's water or fuel — use FuelSupplyLimit instead.
#
#   - class: MonthlyCufsProfile
#     name: my_monthlycufsprofile
#     carrier: Hydro
#     max_cf_by_month: {1: 0.20, 2: 0.18, 6: 0.55}   # month -> capacity factor
#     min_cf_by_month: {6: 0.30}   # optional
#     scope: {bus: NR}   # optional — omit for the whole model; also state_id / region_id
#     allow_variable_renewable_min: False   # optional
#
# RPOConstraint
#   Renewable purchase obligation: eligible generation >= share of served load.
#
#   - class: RPOConstraint
#     name: my_rpoconstraint
#     target_share: 0.43   # share of served load
#     eligible_carriers: [Solar, Wind, Hydro]
#     scope: {bus: NR}   # optional — omit for the whole model; also state_id / region_id
#     category: 'total_renewable'   # optional
#     policy_vintage: ''   # optional
#     accounting_basis: 'served_load'   # optional
#
# ReserveMargin
#   Firm capacity >= (1 + margin) x peak load, using capacity credits.
#   Credit per generator is `capacity_credit_by_carrier` where you give it,
#   otherwise the mean p_max_pu over the `peak_hours` highest-demand hours.
#   Most carriers here already carry a flat de-rate in P_max_pu (coal 0.85,
#   nuclear 0.75), so only wind and solar are sensitive to `peak_hours` --
#   on the all-India FY2030 fleet wind reads 0.589 from a single August
#   evening against 0.329 over the top 100 hours. Configure a carrier only
#   when a probabilistic study gives you a better number than the profile;
#   an averaged profile cannot see ELCC saturation at high penetration.
#
#   Storage is credited only once `storage_peak_duration_h` is set, and is
#   limited by BOTH its energy and its delivery path: a 6 h unit against a
#   4 h event counts fully, a 2 h unit counts half, and neither counts more
#   than the links out of its bus can carry.
#
#   Transmission gets no credit -- crediting each region's import corridor
#   double-counts the exporting generator. Run this system-wide (no scope).
#
#   - class: ReserveMargin
#     name: my_reservemargin
#     margin: 0.15
#     scope: {bus: NR}   # optional — omit for the whole model; also state_id / region_id
#     capacity_credit_by_carrier: {Solar: 0.05, Wind: 0.10}   # optional
#     peak_hours: 100   # average the credit over the N highest-demand hours
#     storage_peak_duration_h: 4   # hours the peak event lasts; omit to leave storage uncredited
#
# StoreCyclingLimit
#   Cap discharge cycles per day/week/month on each Store. Needs hourly snapshots.
#   A warranty covenant (`<= 1 cycle/day`), applied per Store, not pooled
#   across the fleet. Only meaningful at hourly resolution: coarser sampling
#   averages away the swings that make up a cycle, so the class refuses to
#   build unless snapshots.resolution is 1 or max_snapshot_hours is raised.
#
#   In an EXPANSION run this sizes the battery rather than throttling it —
#   half a cycle/day against a 10 MWh daily need buys a 20 MWh store. That
#   is what the covenant means. To cap energy instead, use FuelSupplyLimit.
#
#   - class: StoreCyclingLimit
#     name: my_storecyclinglimit
#     max_cycles: 1.0   # cycles per window
#     window: daily              # daily | weekly | monthly | annual
#     carrier: Battery Storage   # optional
#     scope: {bus: NR}   # optional — omit for the whole model; also state_id / region_id
#     max_snapshot_hours: 1.0   # refuse coarser sampling than this
#
# TechnologyPhaseOut
#   Cap a carrier's TOTAL capacity, on a per-year trajectory.
#   The year-keyed map IS the phase-out — there is no separate start year.
#   It caps the carrier's whole fleet (existing plant plus every vintage),
#   which is the one thing Pipeline_p_max cannot express:
#
#     max_capacity_mw: 250000
#
#   Every modelled year must appear; nothing is interpolated. In a dispatch
#   run the fleet is fixed, so a limit below existing capacity is rejected
#   rather than silently ignored.
#
#   - class: TechnologyPhaseOut
#     name: my_technologyphaseout
#     carrier: Coal
#     max_capacity_mw: 250000   # MW; scalar applies in every modelled year
#     scope: {bus: NR}   # optional — omit for the whole model; also state_id / region_id
#
# ─── end catalogue ───
